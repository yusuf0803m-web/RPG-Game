[project]
name = "pelita-terakhir"
version = "0.1.0"
description = "RPG teks turn-based bergaya JRPG klasik (prototipe)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pelita = "pelita.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pelita*"]

[tool.setuptools.package-data]
pelita = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
